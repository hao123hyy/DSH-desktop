name: Build Release

# 手动触发，或推送 v* tag 时自动构建并发布 GitHub Release。
# 注意：闭源闭包（@deepseek-ai/dsh）不在仓库、也不打进包体——
# 最终用户首次运行 exe 时由应用在线下载。因此构建机只需 node.exe。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 普通 npm install（不能 --ignore-scripts：electron 包的 postinstall 负责下载
      # Electron 二进制，跳过会导致 electronDist 缺失而构建失败）。
      # 闭包下载由 postinstall -> scripts/prepare-payload.js 完成，该脚本检测到
      # CI=true 会自动跳过（构建产物不携带闭包与 node.exe，两者由应用首装在线下载）。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (npm run make)
        run: npm run make

      - name: Package delivery zip
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          tar -a -c -f "dist\dsh-desktop-$ver-win-x64.zip" -C dist DSHDesktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-build
          path: |
            dist/*-portable.exe
            dist/*-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-portable.exe
            dist/*-win-x64.zip
          generate_release_notes: true
