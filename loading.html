<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<title>DSH桌面版</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1115;
    color: #d7dbe2;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; user-select: none; }
  .spinner {
    width: 44px; height: 44px;
    margin: 0 auto 22px;
    border: 4px solid rgba(255,255,255,.12);
    border-top-color: #4d8dff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  #status { font-size: 13px; color: #8b93a1; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="title">DSH桌面版</div>
    <div id="status">正在启动…</div>
  </div>
</body>
</html>
